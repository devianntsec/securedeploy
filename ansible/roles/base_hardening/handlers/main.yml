---
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload ufw
  community.general.ufw:
    state: reloaded
