---
- name: Actualizar paquetes
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600

- name: Instalar paquetes de seguridad
  ansible.builtin.apt:
    name: [ufw, fail2ban, chrony, unattended-upgrades, apparmor, apparmor-utils, libpam-pwquality, needrestart]
    state: present

- name: Parches de seguridad automáticos
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Banner legal
  ansible.builtin.copy:
    dest: /etc/issue.net
    mode: "0644"
    content: |
      Acceso restringido. Toda actividad es registrada y monitoreada.

- name: SSH endurecido (drop-in con prioridad)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Parámetros de kernel
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-securedeploy.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Deshabilitar módulos y protocolos innecesarios
  ansible.builtin.copy:
    dest: /etc/modprobe.d/securedeploy-blacklist.conf
    mode: "0644"
    content: |
      install cramfs /bin/true
      install freevxfs /bin/true
      install jffs2 /bin/true
      install hfs /bin/true
      install hfsplus /bin/true
      install udf /bin/true
      install usb-storage /bin/true
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true

- name: Deshabilitar core dumps
  ansible.builtin.copy:
    dest: /etc/security/limits.d/10-coredump.conf
    mode: "0644"
    content: |
      * hard core 0

- name: Bloquear login directo de root
  ansible.builtin.user:
    name: root
    password_lock: true

- name: Firewall - política por defecto
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Firewall - permitir SSH desde el CIDR de administración
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ admin_cidr }}"
  when: admin_cidr | length > 0

- name: Firewall - permitir la API desde los CIDRs autorizados
  community.general.ufw:
    rule: allow
    port: "{{ app_port }}"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ allowed_ingress_cidrs }}"

- name: Activar UFW
  community.general.ufw:
    state: enabled
    logging: "on"

- name: Fail2ban para SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 4
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Servicios habilitados
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [chrony, fail2ban, apparmor, unattended-upgrades]
